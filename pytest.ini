[pytest]
# `asyncio_mode = auto` is deliberately NOT used: every async test here
# carries an explicit @pytest.mark.asyncio, so a test that forgets the
# marker fails loudly instead of being silently skipped -- pytest reports
# an un-awaited coroutine as a PASS, which is the worst possible outcome
# for a concurrency suite.
asyncio_mode = strict
# Explicit rather than inherited: pytest-asyncio warns that this will
# change default in a future release, and a benchmark suite should not
# have its event-loop lifetime silently redefined by an upgrade.
asyncio_default_fixture_loop_scope = function
testpaths = tests
